<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Wiki review{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231E6B63'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 5.5' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EEF1EC; --card: #FBFCFA; --ink: #1F2A27; --soft: #5C6B66; --faint: #8E9A95;
  --rule: #DCE2DD; --teal: #1E6B63; --teal-ink: #FFFFFF; --teal-wash: #E1EEEA;
  --marker: #F3E38B; --amber: #8A5A00; --amber-wash: #FBF0D4; --red: #A3372C;
  --add: #E3F1E6; --add-ink: #1F5B2E; --del: #F7E3DF; --del-ink: #8C2A1F;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141917; --card: #1C2220; --ink: #E3E9E5; --soft: #A3B0AA; --faint: #74817C;
    --rule: #2C3532; --teal: #6FC2B8; --teal-ink: #0D1A17; --teal-wash: #1F3330;
    --marker: rgba(243, 227, 139, .22); --amber: #F0C46B; --amber-wash: #33290F;
    --red: #F0998F; --add: #17301F; --add-ink: #9AD8A9; --del: #3A1B17; --del-ink: #F2A79E;
  }
}
:root[data-theme="dark"] {
  --paper: #141917; --card: #1C2220; --ink: #E3E9E5; --soft: #A3B0AA; --faint: #74817C;
  --rule: #2C3532; --teal: #6FC2B8; --teal-ink: #0D1A17; --teal-wash: #1F3330;
  --marker: rgba(243, 227, 139, .22); --amber: #F0C46B; --amber-wash: #33290F;
  --red: #F0998F; --add: #17301F; --add-ink: #9AD8A9; --del: #3A1B17; --del-ink: #F2A79E;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.55 var(--sans); font-variant-numeric: tabular-nums; }
main { max-width: 760px; margin: 0 auto; padding: 40px 16px 160px; }
a { color: var(--teal); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 4px; }
.nav { display: flex; gap: 6px; margin: -16px 0 8px; }
.nav a { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px;
  border-radius: 10px; font: 600 15px/1 var(--sans); color: var(--soft); text-decoration: none; }
.nav a:hover { color: var(--teal); }
.nav a[aria-current] { background: var(--teal-wash); color: var(--teal); }
.nav .count { min-width: 22px; padding: 4px 7px; border-radius: 999px; text-align: center;
  background: var(--teal); color: var(--teal-ink); font-size: 13px; }
.next { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 28px 0 0; }
.next a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px;
  border-radius: 10px; border: 1px solid var(--rule); background: var(--card);
  font: 600 15px/1 var(--sans); color: var(--ink); text-decoration: none; }
.next a.go { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); }
.next .none { font-size: 15px; color: var(--soft); }
h1 { font: 600 34px/1.15 var(--serif); letter-spacing: -.01em; margin: 18px 0 8px; }
.lede { font-size: 17px; color: var(--soft); margin: 0 0 28px; max-width: 62ch; }
h2 { font: 600 21px/1.3 var(--serif); margin: 44px 0 4px; }
.h2-note { color: var(--soft); font-size: 15px; margin: 0 0 14px; }
.notice { border-radius: 12px; padding: 14px 16px; margin: 0 0 22px; font-size: 15px; }
.notice.warn { background: var(--amber-wash); color: var(--amber); }
.notice.warn ul { margin: 6px 0 0; padding-left: 18px; }
.notice.ok { background: var(--teal-wash); color: var(--teal); }
button { font: 600 15px/1 var(--sans); border-radius: 10px; padding: 12px 18px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink); }
button.go { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); }
button.quiet { color: var(--red); }
button:disabled { opacity: .45; cursor: default; }
@media (prefers-reduced-motion: no-preference) {
  .page { transition: opacity .25s ease, filter .25s ease; }
}
</style>
{% block head %}{% endblock %}
</head>
<body><main>
<nav class="nav" aria-label="Pages">
  <a href="/chat"{% if nav == "chat" %} aria-current="page"{% endif %}>Chat</a>
  <a href="/review"{% if nav == "reviews" %} aria-current="page"{% elif nav == "review" %} aria-current="true"{% endif %}>Reviews{% if open_reviews %} <span class="count" aria-label="{{ open_reviews|length }} open">{{ open_reviews|length }}</span>{% endif %}</a>
</nav>
{% block body %}{% endblock %}</main>{% block scripts %}{% endblock %}</body>
</html>
