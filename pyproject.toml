[project]
name = "llm-wiki"
version = "0.0.1"
description = "Personal Wiki"
authors = [
    { name = "Laxmikant Mukkawar", email = "laxmikant884@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.25",
    "jinja2>=3.1",
    "langchain>=1.4.5",
    "langchain-anthropic>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.3",
    "starlette>=1.3",
    "tzdata>=2025.2",
    "uvicorn>=0.41",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]  # every subpackage (ingest, assistant, backend, ...), not just the top level

[tool.setuptools.package-data]
"*" = ["py.typed"]
"llm_wiki.ingest" = ["skills/*/SKILL.md"]
"llm_wiki.assistant" = ["skills/*/SKILL.md", "subagent_skills/*/SKILL.md"]
"llm_wiki.review_web" = ["templates/*.html"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["."]  # tests import the eval harness in tests/eval/ (not part of llm_wiki)

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]
